<section class="region-page__section" aria-labelledby="region-itinerary-heading">
  <h2 id="region-itinerary-heading">{{ include.region.itinerary_heading }}</h2>
  <p>{{ include.region.itinerary_copy }}</p>
  {% if include.region.themes and include.region.themes.size > 0 %}
  <div class="region-page__themes">
    {% for theme in include.region.themes %}
    <span class="region-page__theme">{{ theme }}</span>
    {% endfor %}
  </div>
  {% endif %}
</section>
