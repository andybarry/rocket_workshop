<section class="region-page__hero" aria-labelledby="region-hero-heading">
  <div class="region-page__hero-copy">
    <span class="region-page__label">{{ include.region.hero_label }}</span>
    <h1 id="region-hero-heading">{{ include.region.hero_title }}</h1>
    <p>{{ include.region.hero_intro }}</p>
  </div>
  <img class="region-page__hero-image" src="{{ include.region.image_src }}"
    alt="{{ include.region.image_alt }}" width="1600" height="1000" fetchpriority="high">
</section>
