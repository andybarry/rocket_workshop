<section class="region-page__section" aria-labelledby="international-support-heading">
  <h2 id="international-support-heading">{{ include.region.itinerary_heading }}</h2>
  <p>{{ include.region.itinerary_copy }}</p>
  <div class="region-page__support-grid">
    {% for card in include.region.support_cards %}
    <article class="region-page__support-card">
      <h3>{{ card.title }}</h3>
      <p>{{ card.text }}</p>
    </article>
    {% endfor %}
  </div>
</section>
