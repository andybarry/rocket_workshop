  cities: {{ client_cities | jsonify }},
  audiences: {{ site.data.discovery.audiences | jsonify }},
  groupTypes: {{ site.data.discovery.group_types | jsonify }},
  workshops: {{ site.data.workshops | jsonify }},
  copy: {{ site.data.discovery.copy | jsonify }}
};
</script>
<script src="/js/query-validation.js"></script>
<script src="/js/selection-urls.js"></script>
<script src="/js/explorer-copy.js"></script>
