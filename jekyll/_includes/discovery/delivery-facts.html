{% assign copy = site.data.discovery.copy %}
<section class="discovery-section discovery-delivery" aria-label="{{ copy.delivery_heading }}">
  <ul class="discovery-delivery__grid">
    {% for fact in site.data.explorer_copy.delivery_facts %}
    <li>
      <i class="fa {{ fact.icon }}" aria-hidden="true"></i>
      <span>
        <strong>{{ fact.title }}</strong>
        <small>{{ fact.text }}</small>
      </span>
    </li>
    {% endfor %}
  </ul>
</section>
