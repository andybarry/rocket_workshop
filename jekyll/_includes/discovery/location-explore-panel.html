{% assign panel_city = explore_city | default: entry.name %}
{% if entry.state %}
  {% assign panel_state = entry.state | upcase %}
{% else %}
  {% assign panel_state = "UNITED STATES" %}
{% endif %}
<div class="discovery-location-panel" data-city="{{ entry.slug }}">
  <div class="discovery-location-panel__identity">
    <svg class="discovery-location-panel__pin" viewBox="0 0 24 32" width="22" height="29" aria-hidden="true" focusable="false">
      <path fill="#f05f40" d="M12 0C6.6 0 2.2 4.3 2.2 9.6c0 7.2 9.8 22.4 9.8 22.4s9.8-15.2 9.8-22.4C21.8 4.3 17.4 0 12 0zm0 13.2a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/>
      <circle cx="12" cy="9.6" r="2.3" fill="#fff"/>
    </svg>
    <p class="discovery-location-panel__city">{{ panel_city }}</p>
    <p class="discovery-location-panel__state">{{ panel_state }}</p>
  </div>
  <div class="discovery-location-panel__skyline" aria-hidden="true">
    {% include discovery/skylines/skyline.html %}
  </div>
</div>
