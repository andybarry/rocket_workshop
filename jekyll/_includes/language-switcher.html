<!-- Language switcher. The option list is built at runtime by js/i18n.js from
     its LANGUAGES array, so the language set lives in exactly one place. -->
<li class="nav-language dropdown">
    <a href="#" class="nav-lang-toggle dropdown-toggle" data-toggle="dropdown" role="button"
        aria-haspopup="true" aria-expanded="false" aria-label="Change language" title="Change language"
        data-i18n-aria-label="nav.changeLanguage" data-i18n-title="nav.changeLanguage">
        <i class="fa fa-globe" aria-hidden="true"></i><span class="nav-lang-code">EN</span><span class="caret"></span>
    </a>
    <ul class="dropdown-menu dropdown-menu-right nav-lang-menu"></ul>
</li>
