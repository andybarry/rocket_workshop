- id: atlanta-01
  quote: >-
    Before this week, I've never done a workshop, but after doing 2 with stage one
    education(this and the ai one) i dont think I'd even want to do one that wasn't run by
    them. I've learned more in 3 hours than in 10 years of schooling. At no point was I
    bored, or wishing it to be over(though i won't lie, i was falling asleep during the
    first part of the drone presentation because I didn't get enough sleep 💀, in my defense,
    Paul did have a very soothing voice). The drone lesson was the PERFECT balance learning
    and hands on activity. 10/10, i would do anything for a week filled to the brim with
    workshops done by stage one.
  attribution: Workshop participant
  location: Atlanta, GA
  year: 2026
  workshop_label: Robotics
  meta: Atlanta, GA · 2026 · Robotics
  cities: [atlanta]
  workshops: [robotics-drone]
  audiences: []
  group_types: []

- id: atlanta-02
  quote: >-
    As an educator and teaching artist, I want to commend this workshop session and the
    website/teaching tools! They're written so well. Simple to understand, but not "talking
    down" to the scholars. Having multiple ways to understand/visualize the procedures is
    awesome, allowing the scholars to find ways to help themselves understand. Each step is
    incremental enough to not feel tedious while still being manageable/easily
    understandable chunks of information. I love the visuals so much, and the UI is SUPER
    user friendly! Having the steps have little check ins (at this point, click this button
    if this part works) is a great way to offer autonomy to the scholars and feel like
    they're progressing! Not to mention, Robbie is amazing!!! Speaks with my scholars
    respectably and at their level, super open/friendly/inviting to let my scholars feel
    free to ask for help. And knowledgeable to boot! He was able to troubleshoot EVERYONE.
    He even encouraged me, an instructor, to join in. Thank you so much!!!
  attribution: Workshop participant
  location: Atlanta, GA
  year: 2026
  workshop_label: Robotics
  meta: Atlanta, GA · 2026 · Robotics
  cities: [atlanta]
  workshops: [robotics-drone]
  audiences: []
  group_types: []

