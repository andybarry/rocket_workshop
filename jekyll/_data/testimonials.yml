# Contextual testimonials for discovery landing pages.
#
# Each entry can be associated with any combination of:
#   cities:       list of city slugs from _data/discovery/cities.yml
#   workshops:    list of workshop slugs from _data/workshops.yml
#   audiences:    list of audience ids from _data/discovery/audiences.yml
#   group_types:  list of group type ids from _data/discovery/group_types.yml
#
# The contextual-testimonials component ranks entries for the current page:
# entries tagged with the page's own dimension appear first, then untagged
# (general) entries fill the remaining slots. An entry tagged with both a city
# and a workshop is prioritized on pages matching either.
#
# placeholder: true marks an entry as a development placeholder. Placeholder
# entries are NEVER rendered on the site — they document the tagging structure
# until real feedback is added. Replace the quote text and set
# placeholder: false (or remove the field) to publish an entry.
#
# The quotes below were collected from real workshop participants and are the
# same feedback shown on the homepage.

