# City hero colors are tied to a real local reference, not a random palette.
# wash = primary place color, accent = secondary local color, deep = hero field.

boston:
  motif: harbor
  note: Charles River blue and Beacon Hill brick
  wash: "rgba(42, 92, 148, 0.58)"
  accent: "rgba(168, 58, 48, 0.42)"
  deep: "#8eafcc"

