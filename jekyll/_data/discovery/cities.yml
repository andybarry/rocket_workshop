# Cities where Stage One Education delivers or actively supports workshops.
#
# Each entry drives:
#   - a pill in the homepage "Find Your Workshop" Cities card
#   - a generated landing page at /locations/{slug}/
#
# To add, remove, or edit a city, change this file only. No template edits are
# required. Fields:
#   slug              URL + state id (/locations/{slug}/, ?city={slug})
#   name              Full display name used in headings
#   short_label       Compact label used in pills and chips
#   featured          true = shown in the primary row of the Cities card;
#                     false = shown inside the "More U.S. cities" group
#   visual            Theme key for the city hero visual
#                     ("boston" has a bespoke treatment; use "default" otherwise)
#   landmark_image    Blurred hero background of a major local landmark
#   headline          Customer-facing H1 on the landing page
#   intro             Lead paragraph under the H1
#   supporting_copy   Additional paragraphs (list)
#   city_facts        Short cards connecting Stage One with the destination
#   cta_heading/copy  Copy for the Plan a Workshop section
#   seo_title         <title> for the landing page
#   seo_description   Meta description for the landing page
#   copy_status       "final" or "draft" — draft copy is structured placeholder
#                     copy awaiting final marketing review (not shown to users)

- slug: boston
  name: Boston
  short_label: Boston, MA
  featured: true
  visual: boston
  landmark_image: img/locations/boston.jpg
  copy_status: final
  headline: Engineering Workshops in Boston
  intro: >-
    Boston offers an exceptional combination of American history, leading
    academic institutions, science, robotics, and technology. Founded in
    Boston, Stage One adds a locally connected engineering experience that
    fits naturally between campus visits, museum stops, and historic
    sightseeing.
  supporting_copy:
    - >-
      Boston itineraries are shaped by universities, research labs, museums,
      and centuries of innovation. A Stage One workshop connects naturally with
      all of it. Students spend three hours designing, building, coding, and
      testing with a real engineer — a working session that turns the ideas
      surrounding the trip into something they make themselves.
    - >-
      Because Stage One is based in the region, scheduling in Boston is
      straightforward. We bring the instructor, equipment, materials, and
      curriculum directly to your hotel, school, campus, or group venue
      anywhere in the metro area, and we handle setup and cleanup. Morning,
      afternoon, and evening sessions can all be coordinated around your
      itinerary.
  city_facts:
    - title: Founded Here
      text: Stage One Education began in the Boston area and has deep experience with groups visiting the city.
    - title: A Natural Fit
      text: Boston's identity — engineering, technology, universities, innovation — is exactly what students explore in the workshop.
    - title: Easy to Schedule
      text: Local delivery means flexible timing at hotels, schools, campuses, and venues across metro Boston.
  cta_heading: Ready to Add Engineering to Your Boston Itinerary?
  cta_copy: >-
    Share your dates, group size, and venue. Stage One will coordinate a
    workshop around your Boston program.
  seo_title: Boston Engineering Workshops | Stage One Education
  seo_description: >-
    Hands-on AI, robotics, mechanical engineering, and web engineering
    workshops delivered to student groups at hotels, schools, campuses, and
    venues across Boston. Founded in the Boston area.

