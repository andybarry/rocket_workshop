# Audience options for the "Find Your Workshop" discovery experience.
# Each entry drives an option in the homepage Audience card and a generated
# landing page at /workshops/{id}/. Edit this file to change audiences —
# no template edits are required.

- id: middle-school
  label: Middle School
  short_label: Middle School
  icon: fa-book
  age_label: Ages 11–14
  headline: Engineering Workshops for Middle School Groups
  intro: >-
    Middle school students do real engineering from the first minute.
    Structured guidance, clear explanations, and regular hands-on milestones
    keep every student actively involved — no previous experience required.
  supporting_copy:
    - >-
      Instructors introduce technical concepts in accessible language and keep
      the group moving through collaborative challenges. Every Stage One
      workshop — Artificial Intelligence, Robotics, and Mechanical
      Engineering — is available for middle school groups.
    - >-
      The workshop is delivered directly to your school, hotel, campus, or
      group venue. Stage One brings the instructor, equipment, materials, and
      curriculum, and handles setup and cleanup.
  facts:
    - title: No Experience Needed
      text: Concepts are introduced in accessible language with structured guidance.
    - title: Hands-On Milestones
      text: Regular build-and-test moments keep every student engaged.
    - title: All Workshops Available
      text: Every Stage One workshop adapts for middle school groups.
  cta_heading: Ready to Plan a Middle School Workshop?
  cta_copy: >-
    Share your group size, destination, and schedule. Stage One will help
    coordinate the right workshop for your students.
  seo_title: Middle School Engineering Workshops | Stage One Education
  seo_description: >-
    Hands-on AI, robotics, and mechanical engineering
    workshops designed for middle school groups. Delivered to schools, hotels,
    and venues nationwide.

