- id: international-students
  label: International Students
  short_label: International Students
  icon: fa-globe
  age_label: Visiting groups
  headline: Engineering Workshops for International Student Groups
  intro: >-
    Stage One works closely with tour providers, schools, and group leaders
    bringing international students to the United States. The workshop adds a
    genuine American engineering experience to the group's U.S. itinerary.
  supporting_copy:
    - >-
      The complete three-hour program is delivered at a venue the group is
      already using — hotel, campus, school, or conference room — and can be
      scheduled in the morning, afternoon, or evening around the itinerary.
    - >-
      Instruction is clear and accessible, no previous engineering experience
      is required, and the pace adjusts to the group. Stage One coordinates
      directly with the tour provider or group leader.
  facts:
    - title: Itinerary-Friendly
      text: Scheduled around the group's U.S. travel program.
    - title: Clear Instruction
      text: Accessible pacing and language for international participants.
    - title: Coordinated Delivery
      text: Stage One works directly with tour providers and group leaders.
  cta_heading: Planning a U.S. Itinerary for International Students?
  cta_copy: >-
    Share the group's destinations, dates, and size. Stage One will coordinate
    a workshop around the itinerary.
  seo_title: Engineering Workshops for International Student Groups | Stage One Education
  seo_description: >-
    Hands-on engineering workshops for international student groups visiting
    the United States. Delivered to hotels, campuses, and venues, coordinated
    with tour providers.

