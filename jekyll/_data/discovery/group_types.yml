# "Planning For" options in the Find Your Workshop discovery experience.
# Each entry drives an option in the homepage "Planning For" card and a
# generated landing page at /workshops/{id}/. Edit this file to change
# options — no template edits are required.

- id: school-groups
  label: School Group
  short_label: School Group
  headline: Engineering Workshops for School Groups
  intro: >-
    Bring a complete engineering experience to your students — at your school
    or wherever your group travels. Stage One delivers the instructor,
    equipment, materials, and curriculum, and handles setup and cleanup.
  supporting_copy:
    - >-
      The three-hour workshop fits enrichment days, STEM weeks, field-trip
      alternatives, and travel programs. Instruction adapts from middle school
      through high school, and no previous engineering experience is required.
    - >-
      Teachers and chaperones consistently tell us the workshop reaches
      students who don't usually see themselves as "engineering kids" — every
      student builds, codes, and tests something real.
  facts:
    - title: At School or On the Road
      text: Delivered to classrooms, gyms, hotels, and travel venues alike.
    - title: Curriculum Included
      text: Designed and instructed by PhDs, engineers, and educators.
    - title: Scales to Your Group
      text: Formats for single classes through large programs.
  cta_heading: Ready to Plan a School Group Workshop?
  cta_copy: >-
    Share your school, group size, and preferred dates. Stage One will help
    coordinate the workshop.
  seo_title: Engineering Workshops for School Groups | Stage One Education
  seo_description: >-
    Hands-on AI, robotics, and mechanical engineering
    workshops delivered to school groups at schools, hotels, and venues
    nationwide.

- id: educational-tours
  label: Educational Tour
  short_label: Educational Tour
  headline: Engineering Workshops for Educational Tours
  intro: >-
    Stage One partners with educational tour companies across the United
    States. The workshop is a turn-key program block: we deliver the complete
    experience to the group's hotel or venue, on the schedule your itinerary
    needs.
  supporting_copy:
    - >-
      Tour operators use the workshop as a substantive evening activity, an
      arrival-day program, or a hands-on complement to the destinations
      already on the itinerary. It requires no lab, no transportation, and no
      preparation from the group.
    - >-
      One point of contact coordinates everything — dates, venue requirements,
      group size, and workshop selection — and the format is consistent across
      cities, so multi-city operators can offer it anywhere they run programs.
  facts:
    - title: Turn-Key for Operators
      text: One contact, complete delivery, consistent format across cities.
    - title: Evening & Arrival Days
      text: Turns hotel time into a highlight of the trip.
    - title: Delivered to Your Hotel
      text: Any hotel meeting room or group venue can host — instructor and equipment included.
  cta_heading: Ready to Add a Workshop to Your Tour Program?
  cta_copy: >-
    Share your itinerary, group size, and dates. Stage One will coordinate the
    workshop around your program.
  seo_title: Engineering Workshops for Educational Tours — Evening Programs at Your Hotel | Stage One Education
  seo_description: >-
    Turn-key hands-on engineering workshops for educational tour programs,
    delivered to the group's hotel as an evening or arrival-day activity.
    Instructor and equipment included, in cities across the United States.

- id: evening-activities
  label: Evening Activity
  short_label: Evening Activity
  headline: Evening STEM Activities for Student Tour Groups
  intro: >-
    Stage One turns the empty hotel evening into the highlight of the trip. A
    complete three-hour engineering workshop — instructor, equipment,
    materials, and curriculum included — is delivered to the group's own hotel
    or venue, so students build, code, and test something real without a bus,
    a lab, or any preparation from the group.
  supporting_copy:
    - >-
      Touring groups spend their days at museums, campuses, and monuments —
      and their evenings in a hotel with nothing scheduled. The workshop fills
      that slot exactly: it runs in any hotel meeting room, needs only tables,
      chairs, and power outlets, and requires no transportation once the group
      is back at the hotel.
    - >-
      Choose AI, robotics, or mechanical engineering — or run a different
      workshop on each evening of a multi-night stay so the program builds
      across the week. See [sample itineraries](/sample-itineraries/) for how
      tour planners schedule the evening slots.
  facts:
    - title: Delivered to Your Hotel
      text: Any hotel meeting room or group venue can host — no lab, no bus.
    - title: Instructor & Equipment Included
      text: Stage One brings everything and handles setup and cleanup.
    - title: Fills the Evening Slot
      text: Three hours that turn hotel downtime into the trip's highlight.
  cta_heading: Ready to Fill Your Group's Evening?
  cta_copy: >-
    Share your destination city, hotel, dates, and group size. Stage One will
    coordinate the evening workshop around your itinerary.
  seo_title: Evening STEM Activities for Student Tour Groups — Delivered to Your Hotel | Stage One Education
  seo_description: >-
    Hands-on evening engineering workshops for student tour groups, delivered
    to the group's hotel. Instructor and equipment included — AI, robotics,
    and mechanical engineering programs across the United States.

- id: international-groups
  label: International Student Group
  short_label: International Group
  headline: Engineering Workshops for International Groups
  intro: >-
    For international groups traveling through the United States, Stage One
    adds a distinctive American STEM experience without complicating the
    itinerary. We bring the instructors, equipment, materials, and complete
    workshop directly to the group's hotel, school, campus, or meeting venue,
    making it easy to schedule around sightseeing, institutional visits,
    attraction days, and travel.
  supporting_copy:
    - >-
      The three-hour program can be scheduled in the morning, afternoon, or
      evening and delivered at a venue already used by the group. No previous
      engineering experience is required, and instruction can be adapted for
      middle school, high school, college, adult, or mixed-age participants.
    - >-
      Stage One has welcomed international groups from around the world and
      understands the logistics of U.S. educational travel — coordination
      happens directly with the tour provider or coordinating organization.
  facts:
    - title: Delivered to Your Group
      text: At a hotel, school, campus, conference room, or group venue.
    - title: Flexible Scheduling
      text: Morning, afternoon, or evening options around the itinerary.
    - title: Clear, Accessible Experience
      text: No prior experience required; instruction adjusts to the group.
  cta_heading: Planning a U.S. Itinerary for an International Group?
  cta_copy: >-
    Share the group's destinations, dates, and size. Stage One will coordinate
    a workshop around the itinerary.
  seo_title: Engineering Workshops for International Groups Visiting the USA — Delivered to Your Hotel | Stage One Education
  seo_description: >-
    Instructor-led engineering workshops delivered to international student
    groups at hotels, schools, campuses, and venues during United States
    educational travel.

- id: tour-operators
  label: Tour Operators & DMCs
  short_label: Tour Operators
  headline: A Turn-Key Workshop Supplier for Tour Operators and DMCs
  intro: >-
    Stage One is a direct supplier of hands-on engineering workshops for
    educational tour operators, receptive agencies, and DMCs. One contact
    coordinates everything, delivery is turn-key at the group's hotel or
    venue, and the format is identical in every city — so multi-city programs
    stay consistent wherever you run them.
  supporting_copy:
    - >-
      Operator logistics are answered up front: booking lead times are
      flexible, formats scale from a single class to large programs, insurance
      and certificate-of-insurance documentation is available on request, and
      coordination runs directly with your operations team — not the school.
      The three-hour block schedules as an evening activity, an arrival-day
      program, or a daytime session, whichever the itinerary needs.
    - >-
      International operators and receptive agencies are welcome — Stage One
      has hosted groups from around the world and understands the realities of
      inbound U.S. educational travel. See [sample itineraries](/sample-itineraries/)
      for how the workshop slots into multi-city programs.
  facts:
    - title: One Contact, Every City
      text: The same turn-key format and coordination across the country.
    - title: Operator-Direct Coordination
      text: Lead times, scaling, and COI documentation handled with your team.
    - title: Evening & Arrival-Day Slots
      text: Delivered to the group's hotel — no transportation required.
  cta_heading: Building a Program for Your Groups?
  cta_copy: >-
    Share your itineraries, cities, and group profile. Stage One will set up a
    workshop program that works across your departures.
  seo_title: Workshop Supplier for Student Tour Operators & DMCs | Stage One Education
  seo_description: >-
    Stage One supplies turn-key, instructor-led engineering workshops to
    educational tour operators, receptive agencies, and DMCs — delivered to
    group hotels and venues in cities across the United States.

