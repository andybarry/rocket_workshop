- id: middle-school
  label: Middle School
  heading_label: Middle School
  summary: Structured guidance and regular hands-on milestones help middle school students stay actively involved.
  detail: Structured guidance, clear explanations, collaborative challenges, and regular hands-on milestones help middle school students stay actively involved throughout the experience. Technical concepts are introduced in accessible language, and no prior experience is required.
  availability: Artificial Intelligence, Robotics, Mechanical Engineering, and Web Engineering remain available for this audience.

- id: high-school
  label: High School
  heading_label: High School
  summary: Team-based challenges, technical discussion, and hands-on problem-solving for high school groups.
  detail: High school groups can explore practical engineering through team-based challenges, technical discussion, design decisions, and hands-on problem-solving. Instructors adjust the amount of guidance based on the group’s experience, and no previous engineering background is required.
  availability: Every Stage One workshop remains available for this audience.

- id: college-university
  label: College & University
  heading_label: College & University
  summary: A faster pace with greater emphasis on applied engineering and technical decision-making.
  detail: College and university groups can move through the experience at a faster pace with greater emphasis on applied engineering, collaboration, technical decision-making, and discussion. The workshop can complement academic travel, campus programs, leadership experiences, or group events.
  availability: Every Stage One workshop remains available for this audience.

- id: adult-professional
  label: Adult & Professional
  heading_label: Adult & Professional
  summary: A practical, collaborative engineering experience for teams and adult learners.
  detail: Adult and professional groups can take part in a practical, collaborative engineering experience designed for active participation. The format can support professional programs, team experiences, lifelong learning, or customized group events.
  availability: Every Stage One workshop remains available for this audience.

- id: mixed-age
  label: Mixed-Age Group
  heading_label: Mixed-Age
  summary: Pacing, team structure, and guidance can be adjusted so different experience levels can contribute together.
  detail: Stage One instructors can adjust pacing, team structure, explanations, and guidance so participants with different experience levels can contribute to the same hands-on challenge.
  availability: Every Stage One workshop remains available for mixed-age groups.
