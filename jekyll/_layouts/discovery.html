---
layout: default
---
{% assign entry = page.entry %}
{% assign copy = site.data.discovery.copy %}
<body class="discovery-page{% if page.discovery_category == "city" %} discovery-page--location{% endif %}{% if page.discovery_category == "audience" or page.discovery_category == "group_type" %} discovery-page--participants{% endif %}" data-discovery-page
  data-discovery-category="{{ page.discovery_category }}"
  data-discovery-id="{{ entry.context_id }}"
  data-discovery-name="{{ entry.short_label | escape }}">
  {% include navigation.html %}

  <main class="discovery-main">
    {% include discovery/back-link.html %}
    {% include discovery/selection-header.html %}
  </main>

  {% include discovery/page-footer.html %}

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "serviceType": "Hands-on engineering workshop",
    "name": {{ entry.headline | default: page.title | jsonify }},
    "description": {{ entry.seo_description | default: page.description | strip_newlines | jsonify }},
    "url": "https://stageoneeducation.com{{ page.url }}",
    "areaServed": {
      "@type": "Country",
      "name": "United States"
    },
    "provider": {
      "@type": "Organization",
      "name": "Stage One Education",
      "url": "https://stageoneeducation.com/",
      "email": "workshops@stageoneeducation.com"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://stageoneeducation.com/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": {{ entry.short_label | jsonify }},
        "item": "https://stageoneeducation.com{{ page.url }}"
      }
    ]
  }
  </script>
